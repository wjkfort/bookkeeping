name = "bookkeeping-backend"
main = "src/index.ts"
compatibility_date = "2024-02-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "bookkeeping-db"
database_id = "81d99dfc-618f-408f-8e28-d2752a807d45"

# Environment variables
[vars]
EXCHANGE_RATE_CACHE_HOURS = "24"
# DEEPSEEK_API_KEY deliberately does NOT belong here (R2): `[vars]` is committed.
# Use a secret instead —
#   npx wrangler secret put DEEPSEEK_API_KEY
# Optional DEEPSEEK_BASE_URL / DEEPSEEK_MODEL / DEEPSEEK_TEMPERATURE are plain
# vars if you ever need to override the defaults (https://api.deepseek.com,
# deepseek-chat, 0.8). The temperature default is a persona setting rather than a
# neutrality setting — see DEFAULT_DEEPSEEK_TEMPERATURE in
# src/services/deepseek.ts before lowering it.

# Secrets (set via: wrangler secret put <NAME>)
# OPEN_EXCHANGE_RATES_API_KEY
# DEEPSEEK_API_KEY

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# CORS configuration
[env.production]
vars = { ENVIRONMENT = "production" }

[env.development]
vars = { ENVIRONMENT = "development" }
